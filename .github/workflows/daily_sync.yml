name: Daily Vercel Sync

on:
  schedule:
    # Runs every day at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual triggering from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Service Account File
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" > serviceAccountKey.json

      - name: Run Sync Script
        env:
          FIREBASE_SERVICE_ACCOUNT_PATH: serviceAccountKey.json
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          EDGE_CONFIG_ID: ${{ secrets.EDGE_CONFIG_ID }}
          # TEAM_ID: ${{ secrets.TEAM_ID }}
          CURRENT_SEASON: ${{ vars.CURRENT_SEASON || 'season1' }}
          CURRENT_LEVEL: ${{ vars.CURRENT_LEVEL || 'level1' }}
        run: |
          python scripts/sync_vercel.py
