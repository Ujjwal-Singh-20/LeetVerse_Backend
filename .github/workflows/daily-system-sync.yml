name: Daily System Sync (Leaderboard + Curriculum)
on:
  schedule:
    - cron: '30 18 * * *'   # 18:30 UTC = midnight IST
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ping System Sync Endpoint
        run: |
          curl -s -X POST \
            "${{ secrets.BACKEND_URL }}/cron/sync-vercel" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
